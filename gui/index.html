<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pump.fun Launcher</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input, button { width: 100%; padding: 10px; box-sizing: border-box; }
        button { background-color: #007BFF; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Pump.fun Launcher</h1>
        <form id="launchForm">
            <div class="form-group">
                <label for="tokenName">Token Name</label>
                <input type="text" id="tokenName" name="tokenName" required>
            </div>
            <div class="form-group">
                <label for="tokenSymbol">Token Symbol</label>
                <input type="text" id="tokenSymbol" name="tokenSymbol" required>
            </div>
            <div class="form-group">
                <label for="walletSecret">Wallet Secret Key</label>
                <input type="text" id="walletSecret" name="walletSecret" required>
            </div>
            <button type="submit">Launch Token</button>
        </form>
    </div>
    <script>
        document.getElementById('launchForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const tokenName = document.getElementById('tokenName').value;
            const tokenSymbol = document.getElementById('tokenSymbol').value;
            const walletSecret = document.getElementById('walletSecret').value;
            fetch('/launch', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tokenName, tokenSymbol, walletSecret })
            }).then(response => response.json())
              .then(data => alert(data.message))
              .catch(error => console.error('Error:', error));
        });
    </script>
</body>
</html>
